    <path d="M40 40 L56.5 56.5" stroke-width="16"/>
  </g>
  <path d="M39 39 L44.5 44.5" stroke="#151515" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M45 45 L56.5 56.5" stroke="#d71f26" stroke-width="11" stroke-linecap="round"/>
  <circle cx="26" cy="26" r="19" fill="#fff" stroke="#151515" stroke-width="7"/>
  <g clip-path="url(#lens)">
    <circle cx="20" cy="22.4" r="5.2" fill="#1e88d6"/>
    <path d="M7 46 C7 34 12 29.6 20 29.6 C28 29.6 32 34 32 46 Z" fill="#1e88d6"/>
